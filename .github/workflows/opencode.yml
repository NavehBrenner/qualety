name: opencode

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# one agent per issue/PR; a second /oc cancels the first instead of racing it
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Linear surfaces a PR only if it can attach it to an issue *and* a review is
  # actually requested. Both are mechanical, so they happen here rather than in
  # prose the agent may or may not follow. The Linear id is copied off whichever
  # issue the PR closes; prefixes are pinned to the real team keys because a
  # loose [A-Z]+-[0-9]+ also matches in-repo tracker ids like WP-010.
  link-and-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'nvb-opencode[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          gh pr edit "$PR" --add-reviewer NavehBrenner
          issue=$(grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$BODY" |
                  grep -oE '[0-9]+' | head -1)
          [ -n "$issue" ] || { echo "no closing reference — nothing to link"; exit 0; }
          id=$(gh issue view "$issue" --json title,body -q '.title + " " + .body' |
               grep -oE '\b(NVB|LAB)-[0-9]+\b' | head -1)
          [ -n "$id" ] || { echo "issue #$issue names no Linear id"; exit 0; }
          printf '%s\n\nLinear: [%s](https://linear.app/naveh-brenner/issue/%s)\n' \
            "$BODY" "$id" "$id" > body.md
          gh pr edit "$PR" --body-file body.md

  # Reviews never seed or trigger. Issue open by Naveh runs this job directly
  # with `prompt` (v1.18.18 supports `issues` + `prompt`; actor is Naveh so
  # assertPermissions passes). Deliberate `/oc` comments from Naveh
  # (issue_comment / inline pull_request_review_comment) still run; leave
  # `prompt` empty on those events so the comment body is not overridden.
  # The action requires write access on github.actor — bot-authored comments
  # fail with permission: none, so there is no bot seed path.
  opencode:
    if: |
      (github.event_name == 'issues' &&
       github.event.issue.user.login == 'NavehBrenner') ||
      (contains(github.event.comment.body, '/oc') &&
       github.event.comment.user.login == 'NavehBrenner')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Our own App, not opencode's. The action's default path trades an OIDC token
      # for an opencode-agent App token via api.opencode.ai, and that exchange is
      # returning a non-JSON error body it then mishandles. Minting the token here
      # cuts that service out of the path entirely while keeping the property that
      # actually matters: an App token is a distinct identity, so the PRs it opens
      # DO trigger ci.yml. The per-job GITHUB_TOKEN does not, and a required check
      # that never reports blocks the merge forever.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.OPENCODE_APP_ID }}
          private-key: ${{ secrets.OPENCODE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # agent needs history to branch/rebase
          token: ${{ steps.app-token.outputs.token }} # so pushes are App-attributed too
      # use_github_token skips the action's configureGit(), which is what would
      # normally set these. Without them `git commit` dies on an unknown author.
      - name: git identity
        run: |
          git config --global user.name 'opencode-agent[bot]'
          git config --global user.email 'opencode-agent[bot]@users.noreply.github.com'
      # Access token only — the refresh token is blanked before this secret is
      # published, so a runner can read xAI but cannot rotate the grant. It is
      # blanked rather than deleted because opencode's auth schema requires the
      # key and silently drops any credential that fails to decode.
      - name: restore opencode auth
        env:
          AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          mkdir -p ~/.local/share/opencode
          install -m 600 /dev/null ~/.local/share/opencode/auth.json
          printf '%s' "$AUTH_JSON" > ~/.local/share/opencode/auth.json
      # Optional `model:<provider>/<id>` in the triggering comment (no space
      # after the colon; first match wins). Default is xai/grok-4.6. A token
      # that fails the pattern fails the job before the action so a typo
      # cannot silently re-run the exhausted default. Issue-open has no
      # comment body, so it never overrides.
      - name: resolve model
        id: resolve-model
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          token=$(grep -oE 'model:[^[:space:]]+' <<<"$COMMENT" | head -1 || true)
          if [ -z "$token" ]; then
            echo 'model=xai/grok-4.6' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          override=${token#model:}
          if [[ "$override" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._+-]+$ ]]; then
            echo "model=$override" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "invalid model override '$override'; expected model:<provider>/<id> (e.g. model:xai/grok-4.5)"
          exit 1
      - uses: anomalyco/opencode/github@v1.18.18
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # CI has no human for interactive permission prompts. #17 plan hung
          # ~58m on external_directory ask for _github_workflow, then 60m cancel.
          OPENCODE_PERMISSION: '{"*":"allow"}'
        with:
          use_github_token: true
          model: ${{ steps.resolve-model.outputs.model }}
          # ponytail: plan/build split is one expression, not two workflow files.
          # Plan is the default and implementing needs an explicit `/oc build`,
          # because the failure mode we actually hit was the agent skipping
          # straight to a PR when asked in prose for a plan. Issue-open has no
          # comment body, so this expression is `plan`.
          agent: ${{ contains(github.event.comment.body, '/oc build') && 'build' || 'plan' }}
          # Required for `issues`; empty on comments so the body is the prompt.
          prompt: ${{ github.event_name == 'issues' && 'Plan this issue. Post the plan as a comment and stop. Do not create a branch, commit, or PR.' || '' }}
