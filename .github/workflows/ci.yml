name: CI

on:
  push:
    branches: [main]
  pull_request:
  # break-glass: lets ci-hatch.yml (or `gh workflow run ci.yml --ref <branch>`)
  # report `build` on a branch whose PR never got an automatic run.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/qualety/code-embeddings
            .tools/minilm-l6
          key: code-embeddings-onnx-quantized-1-${{ runner.os }}
      - run: pnpm build
      - run: |
          for pkg in qualety @qualety/typescript @qualety/react @qualety/dry @qualety/plugin-kit @qualety/python; do
            out=$(pnpm --filter "$pkg" pack --dry-run)
            echo "$out"
            echo "$out" | grep -q LICENSE
            echo "$out" | grep -q dist/
          done
      # `pnpm qualety` runs dist/cli.js by path, so nothing exercised the bin symlink
      # npm actually installs. That gap shipped v0.1.0 as a silent no-op under npx.
      - name: CLI bin entrypoint smoke
        run: |
          set -euo pipefail
          pnpm --filter qualety pack --pack-destination /tmp
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/src"
          (cd "$tmp" && npm init -y >/dev/null && npm install --silent /tmp/qualety-*.tgz)
          printf '%s\n' '{"plugins":[],"rules":{}}' > "$tmp/qualety.config.json"
          printf '%s\n' 'debugger;' > "$tmp/src/hello.ts"
          set +e
          out=$(cd "$tmp" && ./node_modules/.bin/qualety check 2>&1)
          code=$?
          set -e
          if [[ "$code" -ne 1 ]]; then
            echo "expected exit 1 from the bin entrypoint, got $code" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out" | grep -F 'lint/suspicious/noDebugger'

      - name: Pip wrapper smoke
        run: |
          set -euo pipefail
          stub=packaging/pip/src/qualety/qualety
          printf '%s\n' '#!/bin/sh' 'echo Usage:' > "$stub"
          chmod +x "$stub"
          trap 'rm -f "$stub"' EXIT
          out=$(PYTHONPATH=packaging/pip/src python3 -m qualety --help)
          echo "$out" | grep -F 'Usage:'
      - run: ./scripts/install-minilm.sh
      - run: pnpm test
      - run: pnpm check
      - run: ./scripts/install-dupehound.sh
      - run: echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - run: pnpm qualety
      - run: pnpm qualety --diff
