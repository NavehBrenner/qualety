name: CI

on:
  push:
    branches: [main]
  pull_request:
  # break-glass: lets ci-hatch.yml (or `gh workflow run ci.yml --ref <branch>`)
  # report `build` on a branch whose PR never got an automatic run.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/qualety/code-embeddings
            .tools/minilm-l6
          key: code-embeddings-onnx-quantized-1-${{ runner.os }}
      - run: pnpm build
      - run: |
          for pkg in qualety @qualety/typescript @qualety/react @qualety/dry @qualety/plugin-kit @qualety/python; do
            out=$(pnpm --filter "$pkg" pack --dry-run)
            echo "$out"
            echo "$out" | grep -q LICENSE
            echo "$out" | grep -q dist/
          done
      - name: Pip wrapper smoke
        run: |
          set -euo pipefail
          stub=packaging/pip/src/qualety/qualety
          printf '%s\n' '#!/bin/sh' 'echo Usage:' > "$stub"
          chmod +x "$stub"
          trap 'rm -f "$stub"' EXIT
          out=$(PYTHONPATH=packaging/pip/src python3 -m qualety --help)
          echo "$out" | grep -F 'Usage:'
      - run: ./scripts/install-minilm.sh
      - run: pnpm test
      - run: pnpm check
      - run: ./scripts/install-dupehound.sh
      - run: echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - run: pnpm qualety
      - run: pnpm qualety --diff
